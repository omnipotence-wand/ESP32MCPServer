[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    fastled/FastLED@3.9.7
    bblanchon/ArduinoJson
    ESP32Async/AsyncTCP@^3.3.2
    ; v3.12.0 misclassifies MCP POST requests whose standard Accept header
    ; includes text/event-stream as SSE, so /mcp falls through to 404.
    ; Pin the upstream GET-only SSE classification fix until the next release.
    https://github.com/ESP32Async/ESPAsyncWebServer.git#c265dcf01fc81a8d51e45ff2837c5d3d1f8f4d55
    h2zero/NimBLE-Arduino@^2.2.3
    lovyan03/LovyanGFX@^1.2.0
    WiFi
    ESPmDNS
    solnera/ESP-MCP@0.5.1
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
upload_protocol = esptool
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_MDNS_MAX_SERVICES=10
    -D CONFIG_MDNS_TASK_PRIORITY=1
    -D CONFIG_MDNS_TTL=30
